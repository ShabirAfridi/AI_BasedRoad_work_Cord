spring.application.name=AI_Based_Road_Construction
spring.config.import=optional:file:.env[.properties]
# Server
server.port=9090
# PostgresSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/AI_Based_Road_Contruction
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#This is the secret key used to sign and verify JWT tokens
app.jwt.secret=${JWT_SECRET}
#This is the token validity duration in milliseconds. = 24 hours
app.jwt.expiration=86400000

spring.security.filter.order=10
set MAVEN_OPTS=-Xms256m -Xmx1024m
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#for AI integration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=phi3