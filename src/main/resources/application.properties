spring.application.name=AI_Based_Road_Construction
spring.config.import=optional:file:.env[.properties]
# Server
server.port=9090
# PostgresSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/AI_Based_Road_Contruction
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

spring.security.filter.order=10

#set MAVEN_OPTS=-Xms256m -Xmx1024m
#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#for AI integration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.model=${OLLAMA_MODEL}
admin.seed.email=${ADMIN_EMAIL:admin2@excavation.com}
admin.seed.password=${ADMIN_PASSWORD:ps4xbox360}
google.oauth.client-id=${GOOGLE_CLIENT_ID}

#Liquibase migration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
logging.level.liquibase=INFO
spring.liquibase.drop-first=false
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=phi3


# Camera uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads}